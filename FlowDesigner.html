<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlowDesigner - データ/機能フロー作図</title>
<style>
  :root{
    --bg:#f4f6f9; --panel:#ffffff; --line:#d8dee7; --text:#1b2430; --sub:#64748b;
    --accent:#2563eb; --sel:#2563eb; --grid:#e3e8ef;
    --t-table:#2563eb; --t-func:#16a34a; --t-file:#d97706; --t-ext:#7c3aed; --t-note:#eab308;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:"Segoe UI","Yu Gothic UI",Meiryo,system-ui,sans-serif;
    color:var(--text);background:var(--bg);overflow:hidden;
    display:grid;grid-template-rows:auto 1fr;grid-template-columns:1fr 280px;
    grid-template-areas:"bar bar" "canvas side";
  }
  /* ---------- toolbar ---------- */
  #bar{grid-area:bar;display:flex;align-items:center;gap:6px;flex-wrap:wrap;
    padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
  #bar .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
  #bar select{font:inherit;font-size:13px;padding:5px 6px;border:1px solid var(--line);
    border-radius:6px;background:#fff;color:var(--text)}
  #title{font-weight:600;font-size:14px;border:1px solid transparent;border-radius:6px;
    padding:4px 8px;width:230px;background:transparent;color:inherit}
  #title:hover{border-color:var(--line)}
  #title:focus{outline:none;border-color:var(--accent);background:#fff}
  button{font:inherit;font-size:13px;padding:5px 10px;border:1px solid var(--line);
    background:#fff;border-radius:6px;cursor:pointer;color:var(--text);white-space:nowrap}
  button:hover{background:#eef2f7}
  button:disabled{opacity:.45;cursor:default}
  button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .add{display:inline-flex;align-items:center;gap:5px}
  .dot{width:10px;height:10px;border-radius:3px;display:inline-block}
  #zoomLabel{font-size:12px;color:var(--sub);min-width:42px;text-align:center}
  /* ---------- canvas ---------- */
  #canvas{grid-area:canvas;position:relative;overflow:hidden;cursor:grab;
    background-color:var(--bg);background-image:
      linear-gradient(var(--grid) 1px,transparent 1px),
      linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:20px 20px}
  #canvas.panning{cursor:grabbing}
  #canvas.linking{cursor:crosshair}
  #viewport{position:absolute;left:0;top:0;transform-origin:0 0}
  #edges{position:absolute;left:-10000px;top:-10000px;width:40000px;height:40000px;overflow:visible;pointer-events:none;z-index:1}
  #nodes{position:relative;z-index:2}
  #labels{position:absolute;left:-10000px;top:-10000px;width:40000px;height:40000px;
    overflow:visible;pointer-events:none;z-index:3}
  #edges .hit{stroke:transparent;stroke-width:14;fill:none;pointer-events:stroke;cursor:pointer}
  #edges g.edge{pointer-events:auto}
  #edges path.wire{fill:none;stroke:#64748b;stroke-width:2}
  #edges g.edge.tr path.wire{stroke:#0ea5e9}
  #edges g.edge.sel path.wire{stroke:var(--sel);stroke-width:3}
  text.elabel{font:600 11px "Segoe UI","Yu Gothic UI",Meiryo,sans-serif;fill:#334155;
    paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round;user-select:none}
  .node{position:absolute;background:#fff;border:1px solid var(--line);border-radius:8px;
    box-shadow:0 1px 3px rgba(16,24,40,.08)}
  .node .inner{position:absolute;inset:0;border-radius:inherit;overflow:hidden;
    display:flex;flex-direction:column}
  .node.sel{border-color:var(--sel);box-shadow:0 0 0 2px rgba(37,99,235,.28)}
  .node .hd{display:flex;align-items:center;gap:6px;padding:5px 8px;color:#fff;font-size:12px;
    font-weight:600;cursor:move;flex:0 0 auto;user-select:none}
  .node .hd .ic{opacity:.9}
  .node .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .node .nm[contenteditable="true"]{background:rgba(255,255,255,.25);border-radius:3px;
    padding:0 2px;white-space:normal;outline:none;cursor:text}
  .node .bd{flex:1;padding:6px 8px;font-size:12px;color:#334155;overflow:hidden;line-height:1.5;
    white-space:pre-wrap;word-break:break-word}
  .node .fields{list-style:none;margin:0;padding:0}
  .node .fields li{padding:1px 0;border-bottom:1px dotted #e2e8f0;font-size:11.5px;color:#475569;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .node .code{font-weight:400;font-size:10.5px;opacity:.85;margin-left:4px;flex:0 0 auto}
  .node .sub{font-size:11px;color:#64748b;margin-bottom:2px}
  .node[data-type="function"]{border-radius:22px}
  .node[data-type="batch"]{border-width:2px;border-style:dashed}
  .node[data-type="report"]{border-left:4px solid #be123c}
  .node[data-type="external"]{border-width:2px;border-style:double}
  .node[data-type="note"]{background:#fef9c3;border-color:#eab308;box-shadow:none}
  .node[data-type="note"] .hd{background:transparent !important;color:#854d0e;
    border-bottom:1px dashed #eab308}
  .node .rs{position:absolute;right:0;bottom:0;width:14px;height:14px;cursor:nwse-resize}
  .node .rs::after{content:"";position:absolute;right:3px;bottom:3px;width:6px;height:6px;
    border-right:2px solid #94a3b8;border-bottom:2px solid #94a3b8}
  .port{position:absolute;width:11px;height:11px;border-radius:50%;background:#fff;
    border:2px solid var(--accent);opacity:0;transition:opacity .1s;cursor:crosshair;z-index:3}
  .node:hover .port,.node.sel .port{opacity:1}
  .port:hover{transform:scale(1.35)}
  .port.t{left:50%;top:-6px;margin-left:-5.5px}
  .port.b{left:50%;bottom:-6px;margin-left:-5.5px}
  .port.l{top:50%;left:-6px;margin-top:-5.5px}
  .port.r{top:50%;right:-6px;margin-top:-5.5px}
  #marquee{position:absolute;border:1px solid var(--accent);background:rgba(37,99,235,.08);display:none}
  #hint{position:absolute;left:10px;bottom:8px;font-size:11.5px;color:var(--sub);
    background:rgba(255,255,255,.8);padding:3px 8px;border-radius:5px;pointer-events:none}
  /* ---------- side panel ---------- */
  #side{grid-area:side;background:var(--panel);border-left:1px solid var(--line);
    overflow-y:auto;padding:10px 12px;font-size:13px}
  #side h3{font-size:12px;letter-spacing:.04em;color:var(--sub);margin:4px 0 8px;
    text-transform:uppercase}
  #side label{display:block;font-size:11.5px;color:var(--sub);margin:10px 0 3px}
  #side input[type=text],#side textarea,#side select{width:100%;font:inherit;font-size:13px;
    padding:5px 7px;border:1px solid var(--line);border-radius:6px;background:#fff;color:inherit}
  #side textarea{resize:vertical;min-height:62px}
  #side input:focus,#side textarea:focus,#side select:focus{outline:none;border-color:var(--accent)}
  .crud{display:flex;gap:4px}
  .crud label{display:flex;align-items:center;gap:3px;margin:0;font-size:12px;color:var(--text);
    border:1px solid var(--line);border-radius:6px;padding:4px 7px;cursor:pointer;flex:1;justify-content:center}
  .crud label.on{background:#eff6ff;border-color:var(--accent);color:var(--accent);font-weight:600}
  .crud input{margin:0}
  .chk{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:12.5px;color:var(--text)}
  .row{display:flex;gap:6px;margin-top:10px}
  .row button{flex:1;padding:5px 4px;font-size:12px}
  .empty{color:var(--sub);font-size:12.5px;line-height:1.7}
  .kbd{display:inline-block;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;
    padding:0 4px;font-size:11px;background:#f8fafc;font-family:inherit}
  #delBtn{width:100%;margin-top:14px;border-color:#fca5a5;color:#b91c1c}
  #delBtn:hover{background:#fef2f2}
  /* ---------- modal ---------- */
  #modalBg{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;
    align-items:center;justify-content:center;z-index:50;padding:24px}
  #modalBg.show{display:flex}
  #modal{background:#fff;border-radius:10px;max-width:900px;width:100%;max-height:100%;
    display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.3)}
  #modal .mh{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;
    border-bottom:1px solid var(--line);font-weight:600}
  #modal .mb{padding:16px;overflow:auto}
  table.matrix{border-collapse:collapse;font-size:12.5px}
  table.matrix th,table.matrix td{border:1px solid var(--line);padding:5px 9px;text-align:center}
  table.matrix th{background:#f1f5f9;font-weight:600}
  table.matrix td.rh{text-align:left;background:#f8fafc;font-weight:600;white-space:nowrap}
  table.matrix td.v{font-family:Consolas,monospace;font-weight:600;color:var(--accent)}
  .help dl{margin:0;display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:13px}
  .help dt{color:var(--sub)}
  .help dd{margin:0}
</style>
</head>
<body>

<div id="bar">
  <input id="title" type="text" value="無題のフロー図" spellcheck="false">
  <span class="sep"></span>
  <span id="addBar"></span>
  <span class="sep"></span>
  <button id="undoBtn" title="元に戻す (Ctrl+Z)">↶</button>
  <button id="redoBtn" title="やり直し (Ctrl+Y)">↷</button>
  <span class="sep"></span>
  <button id="zoomOut" title="縮小">−</button>
  <span id="zoomLabel">100%</span>
  <button id="zoomIn" title="拡大">＋</button>
  <button id="fitBtn" title="全体表示 (Ctrl+0)">全体</button>
  <button id="layoutBtn" title="線のつながりから自動で並べ替え (Ctrl+L)">自動整列</button>
  <button id="snapBtn" class="on" title="グリッドに合わせて配置">グリッド</button>
  <span class="sep"></span>
  <select id="viewMode" title="表示する要素を切り替え">
    <option value="all">すべて表示</option>
    <option value="screen">画面遷移だけ</option>
    <option value="data">データの流れだけ</option>
  </select>
  <span class="sep"></span>
  <button id="matrixBtn">CRUD表</button>
  <button id="transBtn">画面遷移表</button>
  <button id="saveBtn" title="Ctrl+S">保存(JSON)</button>
  <button id="openBtn">開く</button>
  <button id="svgBtn">SVG</button>
  <button id="pngBtn">PNG</button>
  <button id="newBtn">新規</button>
  <button id="helpBtn" title="使い方">?</button>
  <input id="file" type="file" accept=".json,application/json" hidden>
</div>

<div id="canvas">
  <div id="viewport">
    <svg id="edges" xmlns="http://www.w3.org/2000/svg" viewBox="-10000 -10000 40000 40000">
      <defs>
        <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
          orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"></path></marker>
        <marker id="arwSel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
          orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"></path></marker>
        <marker id="arwTr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
          orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0ea5e9"></path></marker>
      </defs>
      <g id="edgeLayer"></g>
      <path id="temp" class="wire" stroke-dasharray="5 4" style="display:none"></path>
    </svg>
    <div id="nodes"></div>
    <svg id="labels" xmlns="http://www.w3.org/2000/svg" viewBox="-10000 -10000 40000 40000">
      <g id="labelLayer"></g>
    </svg>
  </div>
  <div id="marquee"></div>
  <div id="hint">ドラッグ=移動 / 背景ドラッグ=スクロール / Shift+背景ドラッグ=範囲選択 / ホイール=拡大縮小 / 枠の○から線を引く</div>
</div>

<div id="side"></div>

<div id="modalBg"><div id="modal">
  <div class="mh"><span id="modalTitle"></span><button id="modalClose">閉じる</button></div>
  <div class="mb" id="modalBody"></div>
</div></div>

<script>
"use strict";
/* ============================================================
   FlowDesigner - 単一HTMLのデータ/機能フロー作図ツール
   保存形式: JSON (schema v1)
   ============================================================ */

/* group: process=処理（CRUD表の行） / data=データ（CRUD表の列） / other
   fields: 項目欄を持つ / timing: 起動タイミング欄を持つ */
const TYPES = {
  screen:   {label:"画面",     icon:"🖥", color:"#0ea5e9", w:190, h:76, group:"process",
             fields:"画面項目", timing:"呼び出し元"},
  function: {label:"機能",     icon:"⚙",  color:"#16a34a", w:190, h:72, group:"process"},
  batch:    {label:"バッチ",   icon:"⏱",  color:"#475569", w:190, h:76, group:"process",
             timing:"起動タイミング"},
  api:      {label:"API",      icon:"⇄",  color:"#0f766e", w:180, h:70, group:"process",
             timing:"エンドポイント"},
  table:    {label:"テーブル", icon:"▦",  color:"#2563eb", w:200, h:120, group:"data",
             fields:"項目"},
  file:     {label:"ファイル", icon:"🗎", color:"#d97706", w:180, h:70, group:"data",
             timing:"配置先"},
  report:   {label:"帳票",     icon:"🧾", color:"#be123c", w:180, h:80, group:"data",
             fields:"出力項目"},
  external: {label:"外部",     icon:"⬡",  color:"#7c3aed", w:170, h:66, group:"other"},
  note:     {label:"メモ",     icon:"✎",  color:"#eab308", w:190, h:100, group:"other"}
};
const GRID = 10;
const LS_KEY = "flowdesigner.doc.v1";

let doc = newDoc();
let sel = {nodes:[], edges:[]};
let view = {x:60, y:60, z:1};
let viewMode = "all";     // all / screen（画面遷移だけ）/ data（データの流れだけ）
let snap = true;
let editingName = false;
const undoStack = [], redoStack = [];

const $ = s => document.querySelector(s);
const canvas = $("#canvas"), viewport = $("#viewport"),
      nodeLayer = $("#nodes"), edgeLayer = $("#edgeLayer"), labelLayer = $("#labelLayer"),
      tempPath = $("#temp"), marquee = $("#marquee"), side = $("#side");

function uid(p){ return p + Math.random().toString(36).slice(2,9); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function newDoc(){ return {schema:1, title:"無題のフロー図", nodes:[], edges:[]}; }
function nodeById(id){ return doc.nodes.find(n => n.id === id); }
function edgeById(id){ return doc.edges.find(e => e.id === id); }
function snapv(v){ return snap ? Math.round(v/GRID)*GRID : Math.round(v); }

/* ---------- 線の種別（画面遷移 or データ）と表示フィルタ ---------- */
function edgeKind(e){
  if (e.kind) return e.kind;
  const a = nodeById(e.from), b = nodeById(e.to);
  return (a && b && a.type === "screen" && b.type === "screen") ? "transition" : "data";
}
/* 外部（利用者・他システム）と画面を結ぶ線は、画面遷移図でも起点として残す */
function isEntryEdge(e){
  const a = nodeById(e.from), b = nodeById(e.to);
  if (!a || !b) return false;
  return (a.type === "external" && b.type === "screen") ||
         (b.type === "external" && a.type === "screen");
}
function visibleEdge(e){
  if (!visibleNode(nodeById(e.from)) || !visibleNode(nodeById(e.to))) return false;
  if (viewMode === "screen") return edgeKind(e) === "transition" || isEntryEdge(e);
  if (viewMode === "data")   return edgeKind(e) !== "transition";
  return true;
}
function visibleNode(n){
  if (!n) return false;
  if (viewMode !== "screen") return true;
  if (n.type === "screen" || n.type === "note") return true;
  // 画面遷移ビューでは、画面遷移の線か画面への入口につながっているノードだけ残す
  return doc.edges.some(e => (edgeKind(e) === "transition" || isEntryEdge(e)) &&
                             (e.from === n.id || e.to === n.id));
}
function visibleNodes(){ return doc.nodes.filter(visibleNode); }
function visibleEdges(){ return doc.edges.filter(visibleEdge); }

/* ---------- 履歴 ---------- */
function snapshot(){
  undoStack.push(JSON.stringify(doc));
  if (undoStack.length > 80) undoStack.shift();
  redoStack.length = 0;
  refreshHistoryButtons();
}
function undo(){
  if (!undoStack.length) return;
  redoStack.push(JSON.stringify(doc));
  doc = JSON.parse(undoStack.pop());
  pruneSelection(); render(); persist(); refreshHistoryButtons();
}
function redo(){
  if (!redoStack.length) return;
  undoStack.push(JSON.stringify(doc));
  doc = JSON.parse(redoStack.pop());
  pruneSelection(); render(); persist(); refreshHistoryButtons();
}
function refreshHistoryButtons(){
  $("#undoBtn").disabled = !undoStack.length;
  $("#redoBtn").disabled = !redoStack.length;
}
function pruneSelection(){
  sel.nodes = sel.nodes.filter(id => nodeById(id));
  sel.edges = sel.edges.filter(id => edgeById(id));
}

/* ---------- 保存(localStorage) ---------- */
let persistTimer = null;
function persist(){
  clearTimeout(persistTimer);
  persistTimer = setTimeout(() => {
    try { localStorage.setItem(LS_KEY, JSON.stringify({doc, view, viewMode})); } catch(e){}
  }, 300);
}
function restore(){
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return false;
    const s = JSON.parse(raw);
    if (!s || !s.doc || !Array.isArray(s.doc.nodes)) return false;
    doc = s.doc; if (s.view) view = s.view;
    if (s.viewMode) viewMode = s.viewMode;
    return true;
  } catch(e){ return false; }
}

/* ============================================================
   座標変換
   ============================================================ */
function toWorld(ev){
  const r = canvas.getBoundingClientRect();
  return {x:(ev.clientX - r.left - view.x)/view.z, y:(ev.clientY - r.top - view.y)/view.z};
}
function applyView(){
  viewport.style.transform = `translate(${view.x}px,${view.y}px) scale(${view.z})`;
  $("#zoomLabel").textContent = Math.round(view.z*100) + "%";
}
function zoomAt(cx, cy, nz){
  nz = Math.min(3, Math.max(0.2, nz));
  const r = canvas.getBoundingClientRect();
  const px = cx - r.left, py = cy - r.top;
  view.x = px - (px - view.x) * (nz/view.z);
  view.y = py - (py - view.y) * (nz/view.z);
  view.z = nz;
  applyView(); persist();
}
function fitView(){
  if (!visibleNodes().length){ view = {x:60,y:60,z:1}; applyView(); return; }
  const b = bbox(40);
  const r = canvas.getBoundingClientRect();
  const z = Math.min(2, Math.max(0.2, Math.min(r.width/b.w, r.height/b.h)));
  view.z = z;
  view.x = (r.width - b.w*z)/2 - b.x*z;
  view.y = (r.height - b.h*z)/2 - b.y*z;
  applyView(); persist();
}
function bbox(pad){
  pad = pad || 0;
  let x1=Infinity,y1=Infinity,x2=-Infinity,y2=-Infinity;
  for (const n of visibleNodes()){
    x1=Math.min(x1,n.x); y1=Math.min(y1,n.y);
    x2=Math.max(x2,n.x+n.w); y2=Math.max(y2,n.y+n.h);
  }
  for (const e of visibleEdges()){           // 線のふくらみ・ラベルもはみ出さないように
    const g = edgeGeom(e); if (!g) continue;
    const pts = [g.mid, {x:g.mid.x, y:g.mid.y-16}];
    for (const t of [0.25,0.5,0.75]) pts.push(bez(g.p,g.c1,g.c2,g.q,t));
    for (const p of pts){
      x1=Math.min(x1,p.x); y1=Math.min(y1,p.y);
      x2=Math.max(x2,p.x); y2=Math.max(y2,p.y);
    }
  }
  if (x1===Infinity) return {x:0,y:0,w:100,h:100};
  return {x:x1-pad, y:y1-pad, w:(x2-x1)+pad*2, h:(y2-y1)+pad*2};
}

/* ============================================================
   描画
   ============================================================ */
function render(){ renderNodes(); renderEdges(); renderSide(); }

function renderNodes(){
  // 名前を直接編集中のときだけ作り直さない（フォーカスが外れていれば作り直す）
  if (editingName && nodeLayer.contains(document.activeElement)) return;
  nodeLayer.innerHTML = "";
  for (const n of visibleNodes()) nodeLayer.appendChild(buildNode(n));
}
/* ノード内の本文（起動タイミング → 説明 → 項目一覧） */
function nodeBody(n){
  const t = TYPES[n.type] || TYPES.function;
  let s = "";
  if (t.timing && n.timing) s += `<div class="sub">${esc(t.icon)} ${esc(n.timing)}</div>`;
  if (n.desc) s += esc(n.desc).replace(/\n/g, "<br>");
  if (t.fields && n.fields && n.fields.length)
    s += `<ul class="fields">${n.fields.map(f => `<li>${esc(f)}</li>`).join("")}</ul>`;
  return s;
}
/* ノードの本文を行の配列で返す（SVG書き出し・高さ自動調整用） */
function bodyLines(n){
  const t = TYPES[n.type] || TYPES.function;
  const out = [];
  if (t.timing && n.timing) out.push({text:t.icon + " " + n.timing, sub:true});
  String(n.desc||"").split(/\r?\n/).filter(Boolean).forEach(l => out.push({text:l}));
  if (t.fields && n.fields) n.fields.forEach(f => out.push({text:f, field:true}));
  return out;
}
function buildNode(n){
  const t = TYPES[n.type] || TYPES.function;
  const el = document.createElement("div");
  el.className = "node" + (sel.nodes.includes(n.id) ? " sel" : "");
  el.dataset.id = n.id; el.dataset.type = n.type;

  if (n.color) el.style.setProperty("--c", n.color);

    `<div class="inner">` +
      `<div class="hd"${n.type === "note" ? "" : ` style="background:${esc(n.color || t.color)}"`}>` +

        (n.code ? `<span class="code">${esc(n.code)}</span>` : "") + `</div>` +

    `</div>` +
    `<div class="port t" data-side="t"></div><div class="port r" data-side="r"></div>` +
    `<div class="port b" data-side="b"></div><div class="port l" data-side="l"></div>` +
    `<div class="rs"></div>`;
  return el;
}

/* ---- 線の経路計算 ---- */
function anchor(n, side){
  switch(side){
    case "t": return {x:n.x+n.w/2, y:n.y,       dx:0, dy:-1};
    case "b": return {x:n.x+n.w/2, y:n.y+n.h,   dx:0, dy:1};
    case "l": return {x:n.x,       y:n.y+n.h/2, dx:-1,dy:0};
    default:  return {x:n.x+n.w,   y:n.y+n.h/2, dx:1, dy:0};
  }
}
function autoSides(a, b){
  const ax=a.x+a.w/2, ay=a.y+a.h/2, bx=b.x+b.w/2, by=b.y+b.h/2;
  const dx=bx-ax, dy=by-ay;
  if (Math.abs(dx) >= Math.abs(dy))
    return dx >= 0 ? ["r","l"] : ["l","r"];
  return dy >= 0 ? ["b","t"] : ["t","b"];
}
function edgeGeom(e){
  const a = nodeById(e.from), b = nodeById(e.to);
  if (!a || !b) return null;
  let s1 = e.fromSide, s2 = e.toSide;
  if (!s1 || !s2){ const auto = autoSides(a,b); s1 = s1||auto[0]; s2 = s2||auto[1]; }
  const p = anchor(a,s1), q = anchor(b,s2);
  const d = Math.max(40, Math.min(160, Math.hypot(q.x-p.x, q.y-p.y)/2));
  const c1 = {x:p.x + p.dx*d, y:p.y + p.dy*d};
  const c2 = {x:q.x + q.dx*d, y:q.y + q.dy*d};
  const path = `M${p.x},${p.y} C${c1.x},${c1.y} ${c2.x},${c2.y} ${q.x},${q.y}`;
  // ラベル位置: 中央から外側へ探し、ノードの枠に重ならない点を使う
  let mid = bez(p,c1,c2,q,0.5);
  for (const t of [0.5,0.43,0.57,0.36,0.64,0.29,0.71,0.22,0.78]){
    const v = bez(p,c1,c2,q,t);
    if (!insideAnyNode(v.x, v.y - 6)){ mid = v; break; }
  }
  return {path, mid, p, q, c1, c2};
}
function insideAnyNode(x, y){
  return doc.nodes.some(n => x > n.x-3 && x < n.x+n.w+3 && y > n.y-3 && y < n.y+n.h+3);
}
function bez(p0,p1,p2,p3,t){
  const u=1-t;
  return {
    x: u*u*u*p0.x + 3*u*u*t*p1.x + 3*u*t*t*p2.x + t*t*t*p3.x,
    y: u*u*u*p0.y + 3*u*u*t*p1.y + 3*u*t*t*p2.y + t*t*t*p3.y
  };
}
function edgeText(e){
  if (edgeKind(e) === "transition")
    return (e.label || "") + (e.cond ? `（${e.cond}）` : "");
  const crud = (e.crud||[]).join("");
  if (e.label && crud) return `${e.label} [${crud}]`;
  return e.label || crud || "";
}
function renderEdges(){
  const NS = "http://www.w3.org/2000/svg";
  edgeLayer.innerHTML = "";
  labelLayer.innerHTML = "";
  for (const e of visibleEdges()){
    const g = edgeGeom(e);
    if (!g) continue;
    const tr = edgeKind(e) === "transition";
    const grp = document.createElementNS(NS,"g");
    grp.setAttribute("class","edge" + (tr ? " tr" : "") + (sel.edges.includes(e.id) ? " sel" : ""));
    grp.dataset.id = e.id;

    const hit = document.createElementNS(NS,"path");
    hit.setAttribute("class","hit"); hit.setAttribute("d", g.path);
    grp.appendChild(hit);

    const w = document.createElementNS(NS,"path");
    w.setAttribute("class","wire"); w.setAttribute("d", g.path);
    const selected = sel.edges.includes(e.id);
    const mk = selected ? "url(#arwSel)" : (tr ? "url(#arwTr)" : "url(#arw)");
    w.setAttribute("marker-end", mk);
    if (e.bidir) w.setAttribute("marker-start", mk);
    if (e.dashed) w.setAttribute("stroke-dasharray","7 5");
    grp.appendChild(w);

    edgeLayer.appendChild(grp);

    const txt = edgeText(e);
    if (txt){   // ラベルはノードより上の層に描く（枠に隠れないように）
      const t = document.createElementNS(NS,"text");
      t.setAttribute("class","elabel"); t.setAttribute("x", g.mid.x);
      t.setAttribute("y", g.mid.y - 5); t.setAttribute("text-anchor","middle");
      if (sel.edges.includes(e.id)) t.setAttribute("fill","#2563eb");
      else if (tr) t.setAttribute("fill","#0369a1");
      t.textContent = txt;
      labelLayer.appendChild(t);
    }
  }
}

function align(mode){
  const ns = sel.nodes.map(nodeById).filter(Boolean);
  if (ns.length < 2) return;
  snapshot();
  if (mode === "l"){ const v = Math.min(...ns.map(n=>n.x)); ns.forEach(n=>n.x=v); }
  if (mode === "r"){ const v = Math.max(...ns.map(n=>n.x+n.w)); ns.forEach(n=>n.x=v-n.w); }
  if (mode === "t"){ const v = Math.min(...ns.map(n=>n.y)); ns.forEach(n=>n.y=v); }
  if (mode === "b"){ const v = Math.max(...ns.map(n=>n.y+n.h)); ns.forEach(n=>n.y=v-n.h); }
  if (mode === "cx"){ const v = avg(ns.map(n=>n.x+n.w/2)); ns.forEach(n=>n.x=snapv(v-n.w/2)); }
  if (mode === "cy"){ const v = avg(ns.map(n=>n.y+n.h/2)); ns.forEach(n=>n.y=snapv(v-n.h/2)); }
  if (mode === "sw"){ const v = Math.round(avg(ns.map(n=>n.w))); ns.forEach(n=>n.w=v); }
  if (mode === "sh"){ const v = Math.round(avg(ns.map(n=>n.h))); ns.forEach(n=>n.h=v); }
  if (mode === "dx" || mode === "dy"){
    const horiz = mode === "dx";
    const key = horiz ? "x" : "y", size = horiz ? "w" : "h";
    const s = [...ns].sort((a,b) => a[key] - b[key]);
    const first = s[0][key], last = s[s.length-1][key] + s[s.length-1][size];
    const total = s.reduce((t,n) => t + n[size], 0);
    const gap = (last - first - total) / (s.length - 1);
    let cur = first;
    for (const n of s){ n[key] = snapv(cur); cur += n[size] + gap; }
  }
  render(); persist();
}
function avg(a){ return a.reduce((x,y)=>x+y,0)/a.length; }

/* ============================================================
   自動整列（階層レイアウト）
   つながりをたどって段（レイヤー）に分け、交差が減るように並べ替える
   ============================================================ */
/* 閉路の「戻る線」をDFSで見つける（画面A→B→A のような往復を段決めから外す） */
function backEdges(pool, links){
  const outs = new Map(pool.map(n => [n.id, []]));
  const indeg = new Map(pool.map(n => [n.id, 0]));
  for (const e of links){ outs.get(e.from).push(e); indeg.set(e.to, indeg.get(e.to) + 1); }
  const state = new Map(pool.map(n => [n.id, 0]));   // 0=未訪問 1=探索中 2=完了
  const found = new Set();
  const starts = [...pool].sort((a,b) => indeg.get(a.id) - indeg.get(b.id));
  for (const s of starts){
    if (state.get(s.id) !== 0) continue;
    const stack = [{id:s.id, i:0}];
    state.set(s.id, 1);
    while (stack.length){
      const top = stack[stack.length-1];
      const es = outs.get(top.id);
      if (top.i >= es.length){ state.set(top.id, 2); stack.pop(); continue; }
      const e = es[top.i++];
      const st = state.get(e.to);
      if (st === 1) found.add(e.id);                  // 探索中の相手に戻る＝閉路
      else if (st === 0){ state.set(e.to, 1); stack.push({id:e.to, i:0}); }
    }
  }
  return found;
}

function autoLayout(opt){
  const o = Object.assign({dir:"h", gapMain:90, gapCross:40, target:"visible"}, opt);
  const pool = o.target === "selection" && sel.nodes.length > 1
    ? sel.nodes.map(nodeById).filter(Boolean)
    : visibleNodes();
  if (pool.length < 2) return false;

  const ids = new Set(pool.map(n => n.id));
  const links = (o.target === "selection" ? doc.edges : visibleEdges())
    .filter(e => ids.has(e.from) && ids.has(e.to) && e.from !== e.to);

  // 1) 段を決める（戻る線＝閉路は段決めから外し、最長経路で割り当て）
  const back = backEdges(pool, links);
  const forward = links.filter(e => !back.has(e.id));
  const layer = {};
  pool.forEach(n => layer[n.id] = 0);
  for (let i = 0; i < pool.length; i++){
    let moved = false;
    for (const e of forward){
      if (layer[e.to] < layer[e.from] + 1){ layer[e.to] = layer[e.from] + 1; moved = true; }
    }
    if (!moved) break;
  }
  const layers = [];
  for (const n of pool){ (layers[layer[n.id]] ||= []).push(n); }
  for (let i = 0; i < layers.length; i++) layers[i] ||= [];

  // 2) 段の中の並び順（重心法を数回。初期順は今の座標）
  const crossKey = o.dir === "h" ? (n => n.y) : (n => n.x);
  layers.forEach(l => l.sort((a,b) => crossKey(a) - crossKey(b)));
  const pos = {};
  const reindex = () => layers.forEach(l => l.forEach((n,i) => pos[n.id] = i));
  reindex();
  const neighbors = (n, back) => links
    .filter(e => (back ? e.to : e.from) === n.id)
    .map(e => pos[back ? e.from : e.to]).filter(v => v !== undefined);
  for (let pass = 0; pass < 4; pass++){
    const back = pass % 2 === 0;
    const order = back ? [...layers.keys()] : [...layers.keys()].reverse();
    for (const li of order){
      const l = layers[li];
      const bary = new Map(l.map(n => {
        const nb = neighbors(n, back);
        return [n.id, nb.length ? avg(nb) : pos[n.id]];
      }));
      l.sort((a,b) => bary.get(a.id) - bary.get(b.id));
      reindex();
    }
  }

  // 3) 座標を決める（各段を中央そろえ。ラベルが入る幅を確保する）
  const labelRoom = Math.min(260, Math.max(0, ...links.map(e => {
    const s = edgeText(e);
    return s ? [...s].reduce((w,c) => w + (c.charCodeAt(0) > 0x2000 ? 11 : 6), 24) : 0;
  })));
  o.gapMain = Math.max(o.gapMain, o.dir === "h" ? labelRoom : Math.round(labelRoom * 0.4) + 40);
  const mainSize = n => o.dir === "h" ? n.w : n.h;
  const crossSize = n => o.dir === "h" ? n.h : n.w;
  const spans = layers.map(l =>
    l.reduce((t,n) => t + crossSize(n), 0) + Math.max(0, l.length-1) * o.gapCross);
  const maxSpan = Math.max(...spans, 0);
  const before = {x: Math.min(...pool.map(n => n.x)), y: Math.min(...pool.map(n => n.y))};
  let main = 0;
  const place = [];
  layers.forEach((l, li) => {
    const depth = Math.max(...l.map(mainSize), 0);
    let cross = (maxSpan - spans[li]) / 2;
    for (const n of l){
      place.push([n, o.dir === "h" ? {x: main, y: cross} : {x: cross, y: main}]);
      cross += crossSize(n) + o.gapCross;
    }
    main += depth + o.gapMain;
  });

  // 4) もとの位置を起点に配置し、整列しなかったノードと重ならないところまでずらす
  snapshot();
  const others = doc.nodes.filter(n => !ids.has(n.id));
  const hit = (dx, dy) => place.some(([n,p]) =>
    others.some(m => p.x+dx < m.x+m.w+20 && p.x+dx+n.w+20 > m.x &&
                     p.y+dy < m.y+m.h+20 && p.y+dy+n.h+20 > m.y));
  let dx = before.x, dy = before.y;
  for (let i = 0; i < 60 && hit(dx, dy); i++) dy += 60;
  for (const [n,p] of place){ n.x = snapv(p.x + dx); n.y = snapv(p.y + dy); }

  // 5) 接続位置は自動。戻る線だけは外側に回して、間のノードに重ならないようにする
  const outer = o.dir === "h" ? "t" : "l";
  for (const e of links){
    if (back.has(e.id)){ e.fromSide = outer; e.toSide = outer; }
    else { delete e.fromSide; delete e.toSide; }
  }
  render(); persist(); fitView();
  return true;
}

function showLayoutDialog(){
  const selMode = sel.nodes.length > 1;
  openModal("自動整列", `<div class="help">
    <p class="empty" style="margin-top:0">線のつながりをたどって段に分け、交差が少なくなるように並べ替えます。
      ${selMode ? "<b>選択中の " + sel.nodes.length + " 個</b>" : "<b>いま表示されているノード</b>"}が対象です
      （元に戻すは Ctrl+Z）。</p>
    <label style="display:block;font-size:11.5px;color:#64748b;margin:14px 0 4px">流れの向き</label>
    <div class="row" style="max-width:420px;margin:0">
      <button id="loH">横（左 → 右）</button>
      <button id="loV">縦（上 → 下）</button>
    </div>
    <label style="display:block;font-size:11.5px;color:#64748b;margin:14px 0 4px">間隔</label>
    <div class="row" style="max-width:420px;margin:0">
      <label class="chk" style="margin:0"><input type="radio" name="loGap" value="60">せまい</label>
      <label class="chk" style="margin:0"><input type="radio" name="loGap" value="90" checked>ふつう</label>
      <label class="chk" style="margin:0"><input type="radio" name="loGap" value="140">ひろい</label>
    </div>
  </div>`);
  const run = dir => {
    const gap = +document.querySelector('input[name="loGap"]:checked').value;
    closeModal();
    const ok = autoLayout({dir, gapMain:gap, gapCross:Math.round(gap*0.5),
                           target: selMode ? "selection" : "visible"});
    if (!ok) alert("整列できるノードが足りません（2個以上必要です）。");
  };
  $("#loH").onclick = () => run("h");
  $("#loV").onclick = () => run("v");
}

function patchNodeDom(n){
  const el = nodeLayer.querySelector(`.node[data-id="${n.id}"]`);
  if (!el) return render();
  if (el.contains(document.activeElement)) return;   // ノード名を直接編集中
  el.replaceWith(buildNode(n));
  renderEdges();
}
function autoHeight(n){
  const lines = bodyLines(n).length;
  n.h = Math.max(TYPES[n.type].h, 34 + lines*18 + 14);
}
function centerOn(n){
  const r = canvas.getBoundingClientRect();
  view.x = r.width/2 - (n.x + n.w/2)*view.z;
  view.y = r.height/2 - (n.y + n.h/2)*view.z;
  applyView(); persist();
}

/* ============================================================
   追加・削除・複製
   ============================================================ */
function addNode(type, wx, wy){
  const t = TYPES[type];
  if (wx == null){
    const r = canvas.getBoundingClientRect();
    wx = (r.width/2 - view.x)/view.z - t.w/2 + (Math.random()*40-20);
    wy = (r.height/2 - view.y)/view.z - t.h/2 + (Math.random()*40-20);
  }
  const n = {id:uid("n"), type, name:t.label+(doc.nodes.filter(x=>x.type===type).length+1),
             x:snapv(wx), y:snapv(wy), w:t.w, h:t.h};
  if (t.fields) n.fields = [];
  snapshot(); doc.nodes.push(n);
  if (!visibleNode(n)){ viewMode = "all"; $("#viewMode").value = "all"; }  // 隠れないように
  sel = {nodes:[n.id], edges:[]};
  render(); persist();
  const el = nodeLayer.querySelector(`.node[data-id="${n.id}"] .nm`);
  if (el) startNameEdit(el, n);
  return n;
}
function deleteSelection(){
  if (!sel.nodes.length && !sel.edges.length) return;
  snapshot();
  doc.nodes = doc.nodes.filter(n => !sel.nodes.includes(n.id));
  doc.edges = doc.edges.filter(e =>
    !sel.edges.includes(e.id) && !sel.nodes.includes(e.from) && !sel.nodes.includes(e.to));
  sel = {nodes:[], edges:[]};
  render(); persist();
}
function duplicateSelection(){
  if (!sel.nodes.length) return;
  snapshot();
  const map = {}, added = [];
  for (const id of sel.nodes){
    const n = nodeById(id); if (!n) continue;
    const c = JSON.parse(JSON.stringify(n));
    c.id = uid("n"); c.x += 30; c.y += 30;
    map[id] = c.id; doc.nodes.push(c); added.push(c.id);
  }
  for (const e of [...doc.edges]){
    if (map[e.from] && map[e.to]){
      const c = JSON.parse(JSON.stringify(e));
      c.id = uid("e"); c.from = map[e.from]; c.to = map[e.to];
      doc.edges.push(c);
    }
  }
  sel = {nodes:added, edges:[]};
  render(); persist();
}
function connect(fromId, fromSide, toId, toSide){
  if (fromId === toId) return;
  snapshot();
  const a = nodeById(fromId), b = nodeById(toId);
  const isTr = a && b && a.type === "screen" && b.type === "screen";
  const e = isTr
    ? {id:uid("e"), from:fromId, to:toId, fromSide, toSide, kind:"transition", label:"", cond:""}
    : {id:uid("e"), from:fromId, to:toId, fromSide, toSide, kind:"data", label:"", crud:[]};
  doc.edges.push(e);
  sel = {nodes:[], edges:[e.id]};
  render(); persist();
}

/* ============================================================
   マウス操作
   ============================================================ */
let drag = null;

canvas.addEventListener("mousedown", ev => {
  if (ev.button === 2) return;
  const portEl = ev.target.closest(".port");
  const rsEl   = ev.target.closest(".rs");
  const nodeEl = ev.target.closest(".node");
  const edgeEl = ev.target.closest("g.edge");

  if (portEl && nodeEl){                                  // 線を引く
    ev.preventDefault();
    drag = {mode:"link", from:nodeEl.dataset.id, side:portEl.dataset.side, start:toWorld(ev)};
    canvas.classList.add("linking");
    return;
  }
  if (rsEl && nodeEl){                                    // リサイズ
    ev.preventDefault();
    const n = nodeById(nodeEl.dataset.id);
    drag = {mode:"resize", id:n.id, w0:n.w, h0:n.h, p0:toWorld(ev), moved:false};
    return;
  }
  if (nodeEl){                                            // 選択・移動
    const id = nodeEl.dataset.id;
    if (ev.target.isContentEditable) return;
    if (ev.shiftKey || ev.ctrlKey){
      if (sel.nodes.includes(id)) sel.nodes = sel.nodes.filter(x => x !== id);
      else sel.nodes.push(id);
      sel.edges = [];
    } else if (!sel.nodes.includes(id)){
      sel = {nodes:[id], edges:[]};
    }
    render();
    const ids = sel.nodes.slice();
    drag = {mode:"move", ids, p0:toWorld(ev),
            orig:ids.map(i => { const n = nodeById(i); return {id:i, x:n.x, y:n.y}; }), moved:false};
    ev.preventDefault();
    return;
  }
  if (edgeEl){                                            // 線を選択
    sel = {nodes:[], edges:[edgeEl.dataset.id]};
    render();
    return;
  }
  // 背景
  if (ev.shiftKey){                                       // 範囲選択
    const r = canvas.getBoundingClientRect();
    drag = {mode:"marquee", sx:ev.clientX - r.left, sy:ev.clientY - r.top};
    marquee.style.display = "block";
    marquee.style.cssText += `;left:${drag.sx}px;top:${drag.sy}px;width:0;height:0`;
  } else {                                                // スクロール
    drag = {mode:"pan", sx:ev.clientX, sy:ev.clientY, vx:view.x, vy:view.y, moved:false};
    canvas.classList.add("panning");
  }
  if (sel.nodes.length || sel.edges.length){ sel = {nodes:[], edges:[]}; render(); }
});

window.addEventListener("mousemove", ev => {
  if (!drag) return;
  if (drag.mode === "pan"){
    view.x = drag.vx + (ev.clientX - drag.sx);
    view.y = drag.vy + (ev.clientY - drag.sy);
    drag.moved = true; applyView();
  } else if (drag.mode === "move"){
    const p = toWorld(ev), dx = p.x - drag.p0.x, dy = p.y - drag.p0.y;
    if (!drag.moved && Math.hypot(dx,dy) > 2){ drag.moved = true; snapshot(); }
    for (const o of drag.orig){
      const n = nodeById(o.id); if (!n) continue;
      n.x = snapv(o.x + dx); n.y = snapv(o.y + dy);
      const el = nodeLayer.querySelector(`.node[data-id="${n.id}"]`);
      if (el){ el.style.left = n.x + "px"; el.style.top = n.y + "px"; }
    }
    renderEdges();
  } else if (drag.mode === "resize"){
    const p = toWorld(ev), n = nodeById(drag.id);
    if (!n) return;
    if (!drag.moved){ drag.moved = true; snapshot(); }
    n.w = Math.max(80, snapv(drag.w0 + p.x - drag.p0.x));
    n.h = Math.max(44, snapv(drag.h0 + p.y - drag.p0.y));
    const el = nodeLayer.querySelector(`.node[data-id="${n.id}"]`);
    if (el){ el.style.width = n.w + "px"; el.style.height = n.h + "px"; }
    renderEdges();
  } else if (drag.mode === "link"){
    const a = nodeById(drag.from);
    if (!a) return;
    const s = anchor(a, drag.side), p = toWorld(ev);
    const d = Math.max(30, Math.min(120, Math.hypot(p.x-s.x, p.y-s.y)/2));
    tempPath.setAttribute("d", `M${s.x},${s.y} C${s.x+s.dx*d},${s.y+s.dy*d} ${p.x},${p.y} ${p.x},${p.y}`);
    tempPath.style.display = "";
  } else if (drag.mode === "marquee"){
    const r = canvas.getBoundingClientRect();
    const x = ev.clientX - r.left, y = ev.clientY - r.top;
    const l = Math.min(x, drag.sx), t = Math.min(y, drag.sy);
    marquee.style.left = l + "px"; marquee.style.top = t + "px";
    marquee.style.width = Math.abs(x - drag.sx) + "px";
    marquee.style.height = Math.abs(y - drag.sy) + "px";
    drag.cur = {x, y};
  }
});

window.addEventListener("mouseup", ev => {
  if (!drag) return;
  const d = drag; drag = null;
  canvas.classList.remove("panning","linking");
  tempPath.style.display = "none";
  marquee.style.display = "none";

  if (d.mode === "link"){
    const el = document.elementFromPoint(ev.clientX, ev.clientY);
    const target = el && el.closest(".node");
    if (target && target.dataset.id !== d.from){
      const port = el.closest(".port");
      connect(d.from, d.side, target.dataset.id, port ? port.dataset.side : null);
    } else if (!target){
      // 空白で離したら、その位置に機能ノードを作ってつなぐ
      const p = toWorld(ev);
      const n = addNode("function", p.x - TYPES.function.w/2, p.y - TYPES.function.h/2);
      connect(d.from, d.side, n.id, null);
    }
  } else if (d.mode === "marquee" && d.cur){
    const r = canvas.getBoundingClientRect();
    const toW = (x,y) => ({x:(x - view.x)/view.z, y:(y - view.y)/view.z});
    const a = toW(Math.min(d.sx,d.cur.x), Math.min(d.sy,d.cur.y));
    const b = toW(Math.max(d.sx,d.cur.x), Math.max(d.sy,d.cur.y));
    sel = {nodes: visibleNodes().filter(n =>
      n.x + n.w > a.x && n.x < b.x && n.y + n.h > a.y && n.y < b.y).map(n => n.id), edges:[]};
    render();
  } else if (d.mode === "move" || d.mode === "resize"){
    if (d.moved) persist();
    renderSide();
  }
});

canvas.addEventListener("dblclick", ev => {
  const nodeEl = ev.target.closest(".node");
  if (nodeEl){
    const n = nodeById(nodeEl.dataset.id);
    const nm = nodeEl.querySelector(".nm");
    if (n && nm) startNameEdit(nm, n);
    return;
  }
  const edgeEl = ev.target.closest("g.edge");
  if (edgeEl){
    sel = {nodes:[], edges:[edgeEl.dataset.id]};
    render();
    const i = $("#eLabel"); if (i){ i.focus(); i.select(); }
    return;
  }
  const p = toWorld(ev);
  addNode("function", p.x - TYPES.function.w/2, p.y - TYPES.function.h/2);
});

function startNameEdit(span, n){
  editingName = true;
  span.contentEditable = "true";
  span.focus();
  const r = document.createRange(); r.selectNodeContents(span);
  const s = getSelection(); s.removeAllRanges(); s.addRange(r);
  const finish = (commit) => {
    span.contentEditable = "false";
    editingName = false;
    if (commit){
      const v = span.textContent.trim();
      if (v && v !== n.name){ snapshot(); n.name = v; }
    }
    render(); persist();
  };
  span.onblur = () => finish(true);
  span.onkeydown = e => {
    if (e.key === "Enter"){ e.preventDefault(); finish(true); }
    else if (e.key === "Escape"){ e.preventDefault(); finish(false); }
    e.stopPropagation();
  };
}

canvas.addEventListener("wheel", ev => {
  ev.preventDefault();
  if (ev.ctrlKey || !ev.shiftKey){
    zoomAt(ev.clientX, ev.clientY, view.z * (ev.deltaY < 0 ? 1.1 : 1/1.1));
  } else {
    view.x -= ev.deltaX; view.y -= ev.deltaY; applyView(); persist();
  }
}, {passive:false});

canvas.addEventListener("contextmenu", ev => ev.preventDefault());

/* ============================================================
   キーボード
   ============================================================ */
window.addEventListener("keydown", ev => {
  const tag = (ev.target.tagName||"").toLowerCase();
  if (tag === "input" || tag === "textarea" || tag === "select" || ev.target.isContentEditable){
    if (ev.key === "Escape") ev.target.blur();
    if (!(ev.ctrlKey && ev.key.toLowerCase() === "s")) return;
  }
  const k = ev.key.toLowerCase();
  if (ev.ctrlKey || ev.metaKey){
    if (k === "z"){ ev.preventDefault(); ev.shiftKey ? redo() : undo(); }
    else if (k === "y"){ ev.preventDefault(); redo(); }
    else if (k === "s"){ ev.preventDefault(); saveJson(); }
    else if (k === "o"){ ev.preventDefault(); $("#file").click(); }
    else if (k === "d"){ ev.preventDefault(); duplicateSelection(); }
    else if (k === "l"){ ev.preventDefault(); showLayoutDialog(); }
    else if (k === "a"){ ev.preventDefault(); sel = {nodes:visibleNodes().map(n=>n.id), edges:[]}; render(); }
    else if (ev.key === "0"){ ev.preventDefault(); fitView(); }
    return;
  }
  if (ev.key === "Delete" || ev.key === "Backspace"){ ev.preventDefault(); deleteSelection(); }
  else if (ev.key === "Escape"){ sel = {nodes:[], edges:[]}; render(); closeModal(); }
  else if (ev.key.startsWith("Arrow") && sel.nodes.length){
    ev.preventDefault();
    const step = ev.shiftKey ? 1 : GRID;
    const dx = ev.key === "ArrowLeft" ? -step : ev.key === "ArrowRight" ? step : 0;
    const dy = ev.key === "ArrowUp" ? -step : ev.key === "ArrowDown" ? step : 0;
    snapshot();
    for (const id of sel.nodes){ const n = nodeById(id); if (n){ n.x += dx; n.y += dy; } }
    render(); persist();
  }
});

function saveJson(){
  download(sanitize(doc.title) + ".json", JSON.stringify(doc, null, 2), "application/json");
}
function sanitize(s){ return String(s||"flow").replace(/[\\/:*?"<>|]/g,"_").trim() || "flow"; }
function download(name, data, mime){
  const blob = data instanceof Blob ? data : new Blob([data], {type:mime + ";charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = sanitize(name);
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

/* ============================================================
   SVG / PNG 書き出し（表示DOMではなくデータから生成）
   ============================================================ */
function buildSvg(){
  const b = bbox(30);
  const out = [];
  out.push(`<svg xmlns="http://www.w3.org/2000/svg" width="${Math.ceil(b.w)}" height="${Math.ceil(b.h)}" viewBox="${b.x} ${b.y} ${b.w} ${b.h}" font-family="Segoe UI, Yu Gothic UI, Meiryo, sans-serif">`);
  out.push(`<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>` +
    `<marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0ea5e9"/></marker></defs>`);
  out.push(`<rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" fill="#ffffff"/>`);
  const labels = [];   // ラベルは最後に描く（ノードに隠れないように）
  for (const e of visibleEdges()){
    const g = edgeGeom(e); if (!g) continue;
    const tr = edgeKind(e) === "transition";
    const col = tr ? "#0ea5e9" : "#64748b", mk = tr ? "url(#at)" : "url(#a)";
    out.push(`<path d="${g.path}" fill="none" stroke="${col}" stroke-width="2"${e.dashed?' stroke-dasharray="7 5"':""} marker-end="${mk}"${e.bidir?` marker-start="${mk}"`:""}/>`);
    const txt = edgeText(e);
    if (txt) labels.push(`<text x="${g.mid.x.toFixed(1)}" y="${(g.mid.y-5).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="600" fill="${tr?"#0369a1":"#334155"}" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">${esc(txt)}</text>`);
  }
  for (const n of visibleNodes()){
    const t = TYPES[n.type] || TYPES.function;
    const col = n.color || t.color || "#475569";
    const rx = n.type === "function" ? Math.min(22, n.h/2) : 8;
    const isNote = n.type === "note";
    const stroke = isNote ? "#eab308" : (n.type === "batch" ? col : "#d8dee7");
    const dash = n.type === "batch" ? ' stroke-dasharray="6 4"' : "";
    out.push(`<g>`);
    out.push(`<rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="${rx}" fill="${isNote?"#fef9c3":"#ffffff"}" stroke="${stroke}"${dash}/>`);
    if (!isNote){
      out.push(`<path d="M${n.x},${n.y+rx} a${rx},${rx} 0 0 1 ${rx},${-rx} h${n.w-rx*2} a${rx},${rx} 0 0 1 ${rx},${rx} v${26-rx} h${-n.w} z" fill="${col}"/>`);
    }
    if (n.type === "report")
      out.push(`<rect x="${n.x}" y="${n.y+26}" width="4" height="${n.h-26}" fill="${col}"/>`);
    out.push(`<text x="${n.x+9}" y="${n.y+18}" font-size="12" font-weight="600" fill="${isNote?"#854d0e":"#ffffff"}">${esc(n.name)}</text>`);
    if (n.code)
      out.push(`<text x="${n.x+n.w-8}" y="${n.y+18}" text-anchor="end" font-size="10.5" fill="${isNote?"#854d0e":"#ffffff"}" opacity="0.85">${esc(n.code)}</text>`);
    let y = n.y + (isNote ? 40 : 44);
    for (const ln of bodyLines(n)){
      if (y > n.y + n.h - 4) break;
      out.push(`<text x="${n.x+9}" y="${y}" font-size="11.5" fill="${ln.sub?"#64748b":"#475569"}">${esc(ln.text)}</text>`);
      y += 17;
    }
    out.push(`</g>`);
  }
  out.push(...labels);
  out.push(`</svg>`);
  return out.join("\n");
}
function exportPng(){
  const svg = buildSvg();
  const b = bbox(30), scale = 2;
  const img = new Image();
  img.onload = () => {
    const cv = document.createElement("canvas");
    cv.width = Math.ceil(b.w*scale); cv.height = Math.ceil(b.h*scale);
    const ctx = cv.getContext("2d");
    ctx.fillStyle = "#fff"; ctx.fillRect(0,0,cv.width,cv.height);
    ctx.drawImage(img, 0, 0, cv.width, cv.height);
    cv.toBlob(blob => download(sanitize(doc.title) + ".png", blob), "image/png");
  };
  img.onerror = () => alert("PNG書き出しに失敗しました。SVGで保存してください。");
  img.src = "data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(svg)));
}

/* ============================================================
   CRUD表 / 集計 / ヘルプ
   ============================================================ */
function openModal(title, html){
  $("#modalTitle").textContent = title;
  $("#modalBody").innerHTML = html;
  $("#modalBg").classList.add("show");
}
function closeModal(){ $("#modalBg").classList.remove("show"); }

function groupNodes(g){ return doc.nodes.filter(n => (TYPES[n.type]||{}).group === g); }
function crudCell(f, s){
  const set = new Set();
  for (const e of doc.edges){
    const hit = (e.from === f.id && e.to === s.id) || (e.from === s.id && e.to === f.id);
    if (!hit) continue;
    (e.crud||[]).forEach(c => set.add(c));
    if (!(e.crud||[]).length) set.add(e.from === s.id ? "R" : "U");  // 未指定時は向きから推定
  }
  return ["C","R","U","D"].filter(c => set.has(c)).join("");
}
function matrixData(){ return {rows: groupNodes("process"), cols: groupNodes("data")}; }

function showMatrix(){
  const {rows, cols} = matrixData();
  if (!rows.length || !cols.length)
    return openModal("CRUD表", `<p class="empty">処理（画面・機能・バッチ・API）と
      データ（テーブル・ファイル・帳票）を線でつなぐと表になります。</p>`);
  const label = n => esc(n.name) +
    (n.code ? `<br><span style="font-weight:400;color:#64748b">${esc(n.code)}</span>` : "");
  let html = `<table class="matrix"><tr><th>処理 ＼ データ</th>${
    cols.map(s => `<th>${label(s)}</th>`).join("")}</tr>`;
  for (const f of rows){
    html += `<tr><td class="rh">${label(f)}` +
      `<span style="font-weight:400;color:#94a3b8"> (${TYPES[f.type].label})</span></td>${
      cols.map(s => `<td class="v">${crudCell(f,s)}</td>`).join("")}</tr>`;
  }
  html += `</table>
    <div class="row" style="margin-top:14px;max-width:380px">
      <button id="csvBtn">CSVで書き出す（Excel用）</button>
      <button id="copyBtn">表をコピー</button>
    </div>
    <p class="empty" style="margin-top:10px">C=登録 / R=参照 / U=更新 / D=削除。
      線にCRUDを設定していない場合は向きから推定（データ→処理=R、処理→データ=U）して表示します。</p>`;
  openModal("CRUD表（処理 × データ）", html);
  $("#csvBtn").onclick = () => download(sanitize(doc.title) + "_CRUD.csv",
    String.fromCharCode(0xFEFF) + matrixText(","), "text/csv");
  $("#copyBtn").onclick = async () => {
    try { await navigator.clipboard.writeText(matrixText("\t")); $("#copyBtn").textContent = "コピーしました"; }
    catch(e){ alert("コピーできませんでした"); }
  };
}
function matrixText(sepChar){
  const {rows, cols} = matrixData();
  const q = v => /[",\n\t]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v;
  const line = a => a.map(q).join(sepChar);
  const out = [line(["処理", "種別", "ID", ...cols.map(s => s.name)])];
  for (const f of rows)
    out.push(line([f.name, TYPES[f.type].label, f.code||"", ...cols.map(s => crudCell(f,s))]));
  return out.join("\r\n");
}

/* ---------- 画面遷移表 ---------- */
function transitions(){
  return doc.edges.filter(e => edgeKind(e) === "transition").map(e => {
    const a = nodeById(e.from), b = nodeById(e.to);
    return {
      fromName: a ? a.name : "?", fromCode: a && a.code ? a.code : "",
      toName:   b ? b.name : "?", toCode:   b && b.code ? b.code : "",
      trigger: e.label || "", cond: e.cond || "", bidir: !!e.bidir, id: e.id
    };
  }).sort((x,y) => x.fromName.localeCompare(y.fromName, "ja"));
}
function showTransitions(){
  const rows = transitions();
  if (!rows.length)
    return openModal("画面遷移表", `<p class="empty">画面ノード同士を線でつなぐと、自動的に「画面遷移」として扱われ、ここに一覧されます。<br>
      データの流れの線も、線を選んで「線の種別」を<b>画面遷移</b>に変えれば遷移として扱えます。</p>`);
  let html = `<table class="matrix">
    <tr><th>遷移元</th><th>契機（ボタン・操作）</th><th>条件</th><th>遷移先</th><th>戻り</th></tr>`;
  for (const r of rows){
    const nm = (n,c) => esc(n) + (c ? ` <span style="font-weight:400;color:#64748b">${esc(c)}</span>` : "");
    html += `<tr data-eid="${r.id}" style="cursor:pointer">
      <td class="rh">${nm(r.fromName, r.fromCode)}</td>
      <td>${esc(r.trigger)}</td><td>${esc(r.cond)}</td>
      <td class="rh">${nm(r.toName, r.toCode)}</td>
      <td>${r.bidir ? "あり" : ""}</td></tr>`;
  }
  html += `</table>
    <div class="row" style="margin-top:14px;max-width:380px">
      <button id="tCsvBtn">CSVで書き出す（Excel用）</button>
      <button id="tCopyBtn">表をコピー</button>
    </div>
    <p class="empty" style="margin-top:10px">行をクリックすると、その遷移の線を選択します（${rows.length}件）。</p>`;
  openModal("画面遷移表", html);
  $("#tCsvBtn").onclick = () => download(sanitize(doc.title) + "_画面遷移.csv",
    String.fromCharCode(0xFEFF) + transText(","), "text/csv");
  $("#tCopyBtn").onclick = async () => {
    try { await navigator.clipboard.writeText(transText("\t")); $("#tCopyBtn").textContent = "コピーしました"; }
    catch(err){ alert("コピーできませんでした"); }
  };
  document.querySelectorAll("#modalBody tr[data-eid]").forEach(tr => tr.onclick = () => {
    sel = {nodes:[], edges:[tr.dataset.eid]};
    closeModal(); render();
    const e = edgeById(tr.dataset.eid), a = e && nodeById(e.from);
    if (a) centerOn(a);
  });
}
function transText(sepChar){
  const q = v => /[",\n\t]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v;
  const out = [["遷移元","遷移元ID","契機","条件","遷移先","遷移先ID","戻り"].join(sepChar)];
  for (const r of transitions())
    out.push([r.fromName, r.fromCode, r.trigger, r.cond, r.toName, r.toCode, r.bidir ? "あり" : ""]
      .map(q).join(sepChar));
  return out.join("\r\n");
}

function showStats(){
  const by = t => doc.nodes.filter(n => n.type === t).length;
  const orphan = doc.nodes.filter(n =>
    !doc.edges.some(e => e.from === n.id || e.to === n.id)).map(n => n.name);
  const noCrud = doc.edges.filter(e => {
    const a = TYPES[(nodeById(e.from)||{}).type] || {}, b = TYPES[(nodeById(e.to)||{}).type] || {};
    const isCrudPair = (a.group === "process" && b.group === "data") ||
                       (a.group === "data" && b.group === "process");
    return isCrudPair && !(e.crud||[]).length;
  }).length;
  openModal("図の内容", `<div class="help"><dl>
    ${Object.entries(TYPES).filter(([k]) => by(k))
      .map(([k,t]) => `<dt>${t.label}</dt><dd>${by(k)}</dd>`).join("")}
    <dt>つながり</dt><dd>${doc.edges.length}（うち画面遷移 ${transitions().length}）</dd>
    <dt>CRUD未設定の線</dt><dd>${noCrud ? noCrud + " 本（向きから推定して表示中）" : "なし"}</dd>
    <dt>未接続のノード</dt><dd>${orphan.length ? esc(orphan.join("、")) : "なし"}</dd>
  </dl></div>`);
}

    <dt>線をつなぐ</dt><dd>枠にカーソルを乗せると出る ○ から相手の枠へドラッグ。空白で離すと機能ノードを作ってつなぎます</dd>

    <dt>複数選択</dt><dd>Shift+クリック、または Shift+背景ドラッグで範囲選択。選択後は揃え・等間隔が使えます</dd>
    <dt>画面移動</dt><dd>背景ドラッグ=スクロール、ホイール=拡大縮小、Shift+ホイール=スクロール</dd>
    <dt>ショートカット</dt><dd>
      <span class="kbd">Del</span> 削除　<span class="kbd">Ctrl+D</span> 複製　<span class="kbd">Ctrl+A</span> 全選択<br>
      <span class="kbd">Ctrl+Z</span> 元に戻す　<span class="kbd">Ctrl+Shift+Z</span>/<span class="kbd">Ctrl+Y</span> やり直し<br>

      <span class="kbd">矢印</span> 10px移動（Shiftで1px）</dd>
